name: Unit Tests
description: "Runs the library's unit tests + linters and optionally gathers coverage."
inputs:
  lint:
    description: "Whether to run linters."
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - uses: ./.github/actions/get-go-version
      id: go-version
    - name: Lint
      if: inputs.lint == 'true'
      shell: bash
      run: make lint

    - name: Test
      shell: bash
      id: test
      run: make test | tee raw_report.txt

    - name: Process test results
      if: steps.test.outcome == 'success'
      id: process-test
      shell: bash
      # A Go module version pin is immutable through the module checksum database, so the
      # release tag is already tamper-proof and human-readable.
      run: go run github.com/jstemmer/go-junit-report/v2@v2.1.0 < raw_report.txt > junit_report.xml

    - name: Upload test results
      if: steps.process-test.outcome == 'success'
      uses: actions/upload-artifact@v4
      with:
        name: Test-result-test${{ steps.go-version.outputs.version }}
        path: junit_report.xml
